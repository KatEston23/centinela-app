name: revtest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/t.mjs <<'X'
          const { checkRevolut } = await import(process.cwd() + "/engine/revolut.mjs");
          const s = {}; console.log(await checkRevolut(s, ["NVDA", "SLS", "FPS", "PPTA"])); console.log(JSON.stringify(s.revolut));
          X
          node /tmp/t.mjs
